<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pulse" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle grid dots -->
  <circle cx="16" cy="16" r="0.7" fill="#334155" opacity="0.5"/>
  <circle cx="32" cy="16" r="0.7" fill="#334155" opacity="0.5"/>
  <circle cx="48" cy="16" r="0.7" fill="#334155" opacity="0.5"/>
  <circle cx="16" cy="48" r="0.7" fill="#334155" opacity="0.5"/>
  <circle cx="32" cy="48" r="0.7" fill="#334155" opacity="0.5"/>
  <circle cx="48" cy="48" r="0.7" fill="#334155" opacity="0.5"/>
  <!-- Heartbeat/Pulse line -->
  <polyline
    points="4,34 14,34 18,34 22,34 25,42 29,18 33,38 36,28 39,34 44,34 48,34 52,34 60,34"
    stroke="url(#pulse)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
  <!-- Active dot on the peak -->
  <circle cx="29" cy="18" r="3" fill="#a78bfa" opacity="0.35"/>
  <circle cx="29" cy="18" r="1.5" fill="#ffffff" opacity="0.9"/>
</svg>
